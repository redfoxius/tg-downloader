<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Channel.Title}} — tgarchive</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1rem}
input[type=text],input[type=number],input[type=date]{font:inherit;padding:.3rem .5rem}
button{font:inherit;padding:.4rem .8rem}fieldset{margin:1rem 0;border:1px solid #ddd}
label{display:block;margin:.3rem 0}.err{color:#b00020}.muted{color:#666}
pre{background:#f6f6f6;padding:.6rem;max-height:18rem;overflow:auto;white-space:pre-wrap}
@media(prefers-color-scheme:dark){body{background:#111;color:#ddd}pre{background:#1d1d1d}fieldset{border-color:#333}.muted{color:#999}}
</style></head><body>
<p><a href="/">← channels</a></p>
<h1>{{.Channel.Title}}</h1>
{{with .Notice}}<p class="err">{{.}}</p>{{end}}
{{if .Channel.NoForwards}}<p class="err">🔒 This channel has content protection (noforwards). Sync only content you have legal access to.</p>{{end}}

<form method="post" action="/channel/{{.Channel.ID}}/settings">
<fieldset><legend>Settings</legend>
<label>Last N days (0 = no limit) <input type="number" name="since_days" min="0" value="{{.Set.SinceDays}}"></label>
<label>Or since date <input type="date" name="since_date" value="{{.SinceDate}}"></label>
<label><input type="checkbox" name="include_comments" {{if .Set.IncludeComments}}checked{{end}}> Save comments</label>
<label><input type="checkbox" name="dl_video" {{if .Set.DLVideo}}checked{{end}}> Download videos</label>
<label><input type="checkbox" name="dl_document" {{if .Set.DLDocument}}checked{{end}}> Download documents</label>
<label><input type="checkbox" name="dl_photo" {{if .Set.DLPhoto}}checked{{end}}> Download photos</label>
<label>Document extensions (comma-separated, empty = any) <input type="text" name="ext_allow" value="{{.Set.ExtAllow}}"></label>
<label>Max file size, MB (0 = unlimited) <input type="number" name="max_size_mb" min="0" value="{{.Set.MaxSizeMB}}"></label>
<label>Parallel downloads <input type="number" name="concurrency" min="1" max="16" value="{{.Set.Concurrency}}"></label>
<label><b>Export site:</b></label>
<label><input type="checkbox" name="export_comments" {{if .Set.ExportComments}}checked{{end}}> Show comments</label>
<label><input type="checkbox" name="export_video" {{if .Set.ExportVideo}}checked{{end}}> Show videos</label>
<label><input type="checkbox" name="export_document" {{if .Set.ExportDocument}}checked{{end}}> Show documents</label>
<label><input type="checkbox" name="export_photo" {{if .Set.ExportPhoto}}checked{{end}}> Show photos</label>
<button>Save settings</button>
</fieldset></form>

<form method="post" action="/channel/{{.Channel.ID}}/sync">
{{if .Channel.NoForwards}}<label><input type="checkbox" name="i_own_access"> I have legal access to this content (--i-own-access)</label>{{end}}
<button id="sync">Sync (posts, comments, media)</button>
<button id="dl" formaction="/channel/{{.Channel.ID}}/download">Download media only</button>
<button id="exp" formaction="/channel/{{.Channel.ID}}/export">Export site</button>
<button formaction="/job/cancel" formnovalidate>Cancel</button>
</form>
<p id="job" class="muted"></p><pre id="log" hidden></pre>
<script>
async function poll(){try{
  const j=await (await fetch('/api/job')).json();
  document.getElementById('job').textContent=j.name?(j.running?'Running: ':'Last job: ')+j.name+(j.error?' — '+j.error:''):'';
  const l=document.getElementById('log');l.hidden=!j.log.length;l.textContent=j.log.join('\n');
  document.getElementById('sync').disabled=j.running;document.getElementById('dl').disabled=j.running;document.getElementById('exp').disabled=j.running;
}catch(e){}}
poll();setInterval(poll,1000);
</script>
</body></html>
